<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluoddity</title>
    <style>
      :root { color-scheme: dark; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;

        /* iOS: `overflow: hidden` famously does not stop body rubber-band
           scrolling, and a pinch-zoomed PAGE pans with one finger at the
           system level -- delivering no events to the app at all, which reads
           as "every drag tool is dead". Declare the whole document
           gesture-free; the panel manages its own scrolling regions. */
        touch-action: none;
        overscroll-behavior: none;
      }

      /* The canvas fills the viewport in CSS pixels; its backing store is sized
         in device pixels by src/app/surface.ts. The two are not the same thing
         and must not be conflated -- see that file's header. */
      #app {
        display: block;
        width: 100%;
        height: 100%;

        /* The canvas owns its touches. Without this the browser claims them
           for its own scrolling and zooming -- a finger drag fires pointerdown
           and then pointercancel, and the stroke it should have drawn becomes
           a page scroll. This one property is what makes touch input POSSIBLE;
           the listeners in src/ui/inputBinding.ts assume it. */
        touch-action: none;

        /* A long-press on iOS otherwise offers to select/share the canvas as
           an image, mid-stroke. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      #gpu-error {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        padding: 2rem;
        text-align: center;
        font: 16px/1.5 system-ui, sans-serif;
        color: #eee;
        background: #1a1a1a;
      }

      #gpu-error h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
      #gpu-error p  { margin: 0; max-width: 44rem; color: #bbb; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
